name: CRON Today Sports Data

on:
  repository_dispatch:
    types: [scheduled-update]
  workflow_dispatch:  # 手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 添加并发控制
    concurrency: 
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Run data fetcher
      run: node ./update-data-today.js  # 改为运行新的脚本文件
      
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sports-data-today.json  # 改为提交今天的文件
        git diff --staged --quiet || (git commit -m "Update today sports data [skip ci]" && git push)
        
    - name: Trigger CF Worker refreshall
      if: success()
      run: |
        echo "🔄 触发 Cloudflare Worker 全部更新..."
        curl -s -X GET "https://getnewmatch.hxfkof-9ef.workers.dev/refreshall" \
          -H "User-Agent: GitHub-Actions" > /dev/null
        echo "✅ CF Worker 全部更新已触发"
